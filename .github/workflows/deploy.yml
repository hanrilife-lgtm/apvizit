name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Replace tokens in script.js
        run: |
          sed -i "s|{{TELEGRAM_TOKEN}}|${{ secrets.TELEGRAM_TOKEN }}|g" script.js
          sed -i "s|{{TELEGRAM_CHAT_ID}}|${{ secrets.TELEGRAM_CHAT_ID }}|g" script.js

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
